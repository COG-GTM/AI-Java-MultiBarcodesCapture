openapi: 3.1.0
info:
  title: AI MultiBarcodes Capture - Web Management API
  version: 1.36.0
  description: |
    REST API exposed by the PHP WebInterface (`WebInterface/src/api`). The Android app posts capture
    sessions to `/api/barcodes.php`; the web UI (`WebInterface/src/js/wms-app.js`) uses the remaining
    operations. The API is unauthenticated and intended for trusted local networks.

    PHP endpoints dispatch on HTTP method plus a JSON `action` field or query parameter, so several
    operations share one path. Some numeric values are returned as JSON strings by PDO (noted per field).
  license:
    name: Zebra Development Tool License Agreement
    url: https://github.com/ZebraDevs/AISuite_Android_Samples/blob/main/Zebra%20Development%20Tool%20License.pdf
servers:
  - url: http://localhost:3500/api
    description: Local Docker WebInterface (WebInterface/start-services.sh)
security: []
tags:
  - name: sessions
    description: Capture sessions uploaded by the Android app
  - name: barcodes
    description: Individual captured barcodes
  - name: export
    description: File export of sessions
  - name: server
    description: Server information
paths:
  /barcodes.php:
    get:
      tags: [sessions]
      operationId: getSessions
      summary: List the latest 100 sessions, or one session with its barcodes when `session_id` is set
      parameters:
        - name: session_id
          in: query
          required: false
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Session list (no `session_id`) or session details (`session_id` set)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionListResponse'
                  - $ref: '#/components/schemas/SessionDetailsResponse'
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      tags: [sessions]
      operationId: postSession
      summary: Upload a capture session from the Android app, or merge sessions (`action=bulk_merge`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CaptureSessionRequest'
                - $ref: '#/components/schemas/BulkMergeRequest'
      responses:
        '200':
          description: Session stored or sessions merged
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CaptureSessionResponse'
                  - $ref: '#/components/schemas/BulkMergeResponse'
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    put:
      tags: [barcodes]
      operationId: updateBarcode
      summary: Update barcode status (`barcode_id` query) or barcode data (`action=update_barcode`)
      parameters:
        - name: barcode_id
          in: query
          required: false
          description: Required when updating status; omit when using `action=update_barcode`.
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpdateBarcodeDataRequest'
                - $ref: '#/components/schemas/UpdateBarcodeStatusRequest'
      responses:
        '200':
          description: Barcode updated
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UpdateBarcodeDataResponse'
                  - $ref: '#/components/schemas/MessageResponse'
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    delete:
      tags: [sessions]
      operationId: deleteSessions
      summary: Delete selected sessions (`action=bulk_delete`) or reset all data (`reset=all`)
      parameters:
        - name: reset
          in: query
          required: false
          schema: {type: string, enum: [all]}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkDeleteRequest'}
      responses:
        '200':
          description: Data deleted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeleteResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    options:
      tags: [sessions]
      operationId: barcodesPreflight
      summary: CORS preflight
      responses:
        '200': {description: CORS headers only}
  /export.php:
    post:
      tags: [export]
      operationId: exportSessions
      summary: Export sessions as a downloadable TXT, CSV or XLSX file
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '200':
          description: 'File attachment (`Content-Disposition: attachment; filename="barcode_export_<timestamp>.<ext>"`)'
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/plain:
              schema: {type: string}
            text/csv:
              schema: {type: string}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}
        '400': {$ref: '#/components/responses/ExportError'}
        '404': {$ref: '#/components/responses/ExportError'}
        '405': {$ref: '#/components/responses/ExportError'}
        '500': {$ref: '#/components/responses/ExportError'}
  /server-info.php:
    get:
      tags: [server]
      operationId: getServerInfo
      summary: Server network information shown in the web UI (used to configure the Android endpoint)
      responses:
        '200':
          description: Server info
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerInfoResponse'}
        '500': {$ref: '#/components/responses/Error'}
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ExportError:
      description: Export error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
  schemas:
    IntOrNumericString:
      description: Integer, or the same integer encoded as a string by PDO
      oneOf:
        - type: integer
        - type: string
          pattern: '^-?[0-9]+$'
    MysqlDateTime:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
      examples: ['2026-11-19 14:00:00']
    Symbology:
      type: integer
      minimum: -1
      maximum: 45
      description: >-
        Numeric symbology id. Must exist in the `symbologies` table, which mirrors the Android enum
        `EBarcodesSymbologies` (parity enforced by `EBarcodesSymbologiesTest`).
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: {const: false}
        error: {type: string}
    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success: {const: true}
        message: {type: string}
    CapturedBarcode:
      type: object
      required: [value, symbology]
      properties:
        value: {type: string}
        symbology: {$ref: '#/components/schemas/Symbology'}
        quantity: {type: integer, minimum: 1, default: 1}
        timestamp:
          type: string
          description: ISO-8601 or `Y-m-d H:i:s`; server falls back to the current time if unparseable
    CaptureSessionRequest:
      type: object
      required: [barcodes]
      not: {required: [action]}
      properties:
        barcodes:
          type: array
          items: {$ref: '#/components/schemas/CapturedBarcode'}
        session_timestamp: {type: string}
        device_info: {type: string, default: Unknown Device}
        device_ip: {type: string, default: 0.0.0.0}
    CaptureSessionResponse:
      type: object
      required: [success, message, session_id, total_barcodes]
      properties:
        success: {const: true}
        message: {type: string}
        session_id: {$ref: '#/components/schemas/IntOrNumericString'}
        total_barcodes: {$ref: '#/components/schemas/IntOrNumericString'}
    SessionIds:
      type: array
      items: {type: integer, minimum: 1}
    BulkMergeRequest:
      type: object
      required: [action, session_ids]
      properties:
        action: {const: bulk_merge}
        session_ids:
          allOf:
            - $ref: '#/components/schemas/SessionIds'
            - minItems: 2
    BulkMergeResponse:
      type: object
      required: [success, message, new_session_id, merged_sessions_count, total_barcodes, consolidated_barcodes]
      properties:
        success: {const: true}
        message: {type: string}
        new_session_id: {$ref: '#/components/schemas/IntOrNumericString'}
        merged_sessions_count: {type: integer}
        total_barcodes: {$ref: '#/components/schemas/IntOrNumericString'}
        consolidated_barcodes: {type: integer}
    BulkDeleteRequest:
      type: object
      required: [action, session_ids]
      properties:
        action: {const: bulk_delete}
        session_ids:
          allOf:
            - $ref: '#/components/schemas/SessionIds'
            - minItems: 1
    DeleteResponse:
      type: object
      required: [success, message, deleted_sessions, deleted_barcodes]
      properties:
        success: {const: true}
        message: {type: string}
        deleted_sessions: {$ref: '#/components/schemas/IntOrNumericString'}
        deleted_barcodes: {$ref: '#/components/schemas/IntOrNumericString'}
    UpdateBarcodeStatusRequest:
      type: object
      not: {required: [action]}
      properties:
        processed: {type: boolean, default: false}
        notes: {type: string, default: ''}
    UpdateBarcodeDataRequest:
      type: object
      required: [action, barcode_id, value, symbology, quantity]
      properties:
        action: {const: update_barcode}
        barcode_id: {type: integer, minimum: 1}
        value: {type: string}
        symbology: {$ref: '#/components/schemas/Symbology'}
        quantity: {type: integer, minimum: 1}
    UpdateBarcodeDataResponse:
      type: object
      required: [success, message, updated_fields]
      properties:
        success: {const: true}
        message: {type: string}
        updated_fields:
          type: object
          required: [value, symbology, symbology_name, quantity]
          properties:
            value: {type: string}
            symbology: {type: integer}
            symbology_name: {type: string}
            quantity: {type: integer}
    SessionSummary:
      description: Row of the `session_statistics` view
      type: object
      required: [id, session_timestamp, device_info, device_ip, created_at, total_barcodes]
      properties:
        id: {type: integer}
        session_timestamp: {$ref: '#/components/schemas/MysqlDateTime'}
        device_info: {type: [string, 'null']}
        device_ip: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/MysqlDateTime'}
        total_barcodes: {type: integer}
        unique_symbologies: {type: integer}
        first_scan: {type: [string, 'null']}
        last_scan: {type: [string, 'null']}
        total_quantity:
          oneOf:
            - $ref: '#/components/schemas/IntOrNumericString'
            - type: 'null'
        processed_count: {$ref: '#/components/schemas/IntOrNumericString'}
        pending_count: {$ref: '#/components/schemas/IntOrNumericString'}
    BarcodeDetail:
      description: Row of the `barcode_details` view
      type: object
      required: [id, session_id, value, symbology, symbology_name, quantity, timestamp, processed]
      properties:
        id: {type: integer}
        session_id: {type: integer}
        value: {type: string}
        symbology: {type: integer}
        symbology_name: {type: [string, 'null']}
        quantity: {type: integer}
        timestamp: {$ref: '#/components/schemas/MysqlDateTime'}
        processed: {type: integer, enum: [0, 1]}
        notes: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/MysqlDateTime'}
        session_timestamp: {$ref: '#/components/schemas/MysqlDateTime'}
        device_info: {type: [string, 'null']}
        device_ip: {type: [string, 'null']}
    SessionListResponse:
      type: object
      required: [success, sessions, total]
      properties:
        success: {const: true}
        sessions:
          type: array
          items: {$ref: '#/components/schemas/SessionSummary'}
        total: {type: integer}
    SessionDetailsResponse:
      type: object
      required: [success, session, barcodes]
      properties:
        success: {const: true}
        session: {$ref: '#/components/schemas/SessionSummary'}
        barcodes:
          type: array
          items: {$ref: '#/components/schemas/BarcodeDetail'}
    ExportRequest:
      type: object
      required: [session_ids, format]
      properties:
        session_ids:
          allOf:
            - $ref: '#/components/schemas/SessionIds'
            - minItems: 1
        format: {type: string, enum: [txt, csv, excel, xlsx]}
    ServerInfoResponse:
      type: object
      required: [success, local_ip, external_ip, hostname, server_addr]
      properties:
        success: {const: true}
        local_ip: {type: string}
        external_ip: {type: string}
        hostname: {type: string}
        server_addr: {type: string}
